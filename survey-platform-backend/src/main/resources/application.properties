spring.application.name=survey-platform-backend

# Local in-memory database. Data is recreated whenever the application restarts.
spring.datasource.url=jdbc:h2:mem:survey_platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# The current migrations contain PostgreSQL-specific PL/pgSQL triggers.
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Local development JWT settings. Override them outside local development.
jwt.secret=c3VydmV5LXBsYXRmb3JtLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC1rZXktMjAyNg==
jwt.expiration-ms=86400000

# H2-only account for exercising the admin authentication flow locally.
app.local-admin.enabled=true
app.local-admin.email=admin@respondly.local
app.local-admin.password=Admin123!
app.local-respondent.email=respondent@respondly.local
app.local-respondent.password=Respondent123!
