<main class="auth-page">
  <form class="auth-card" (ngSubmit)="submit()">
    <a routerLink="/" class="brand">Respondly</a>
    <p class="eyebrow">{{ expectedRole === 'ADMIN' ? 'Administration' : 'Interview portal' }}</p>
    <h1>{{ expectedRole === 'ADMIN' ? 'Admin sign in' : 'Respondent sign in' }}</h1>
    <label>Email<input name="email" type="email" autocomplete="email" [(ngModel)]="email" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" [(ngModel)]="password" required minlength="8"></label>
    @if (message) { <p class="error" role="alert">{{ message }}</p> }
    <button type="submit" [disabled]="submitting">{{ submitting ? 'Signing in…' : 'Sign in' }}</button>
    @if (expectedRole === 'RESPONDENT') { <a [routerLink]="['/register/respondent']" [queryParams]="{ returnUrl: returnUrl }">Create respondent account</a> }
    <a routerLink="/">Return home</a>
  </form>
</main>
